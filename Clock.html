<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Numeral Clock</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      /* Mirror-like background with reflective effect */
      background: 
        linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.3)), 
        linear-gradient(45deg, #333, #777);
      background-blend-mode: screen;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .clock-container {
      position: relative;
      width: 350px;
      height: 350px;
      border: 15px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      /* Glass/mirror effect */
      background: linear-gradient(145deg, rgba(255,255,255,0.4), rgba(120,120,120,0.1));
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.3),
        inset 0 0 30px rgba(255,255,255,0.2),
        inset 0 0 10px rgba(0,0,0,0.1);
      backdrop-filter: blur(5px);
      animation: fadeIn 1.5s ease-out;
    }

    .clock-center {
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    .clock-container .roman-numerals {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .roman-numerals span {
      position: absolute;
      font-size: 22px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    .hour-hand, .minute-hand, .second-hand {
      position: absolute;
      border-radius: 5px;
      transform-origin: 50% 100%; /* Rotate around the bottom center */
      transform:translate(-50%,-50%);
      left: 50%;
      z-index: 5;
    }

    .hour-hand {
      width: 10px;
      height: 80px;
      bottom: 50%; /* Start from the center */
      background: linear-gradient(to top, white, #ddd);
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }

    .minute-hand {
      width: 6px;
      height: 110px;
      bottom: 50%;
      background: linear-gradient(to top, white, #eee);
      box-shadow: 0 0 3px rgba(0,0,0,0.3);
    }

    .second-hand {
      width: 3px;
      height: 130px;
      bottom: 50%;
      background: #e74c3c;
      box-shadow: 0 0 3px rgba(0,0,0,0.3);
    }

    /* Tick marks */
    .tick {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
    }

    .tick::before {
      content: '';
      position: absolute;
      width: 2px;
      height: 10px;
      background: rgba(255,255,255,0.7);
      left: 50%;
      top: 5px;
      transform: translateX(-50%);
    }

    @keyframes fadeIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed; 
      bottom: 20px; 
      left: 50%; 
      transform: translate(-50%);
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 20px;
      width: fit-content;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Positioning Roman numerals */
    .roman-numerals .num1 { transform: rotate(-60deg) translate(130px) rotate(60deg); }
    .roman-numerals .num2 { transform: rotate(-30deg) translate(130px) rotate(30deg); }
    .roman-numerals .num3 { transform: translate(130px); }
    .roman-numerals .num4 { transform: rotate(30deg) translate(130px) rotate(-30deg); }
    .roman-numerals .num5 { transform: rotate(60deg) translate(130px) rotate(-60deg); }
    .roman-numerals .num6 { transform: translateY(130px); }
    .roman-numerals .num7 { transform: rotate(-60deg) translate(-130px) rotate(60deg); }
    .roman-numerals .num8 { transform: rotate(-30deg) translate(-130px) rotate(30deg); }
    .roman-numerals .num10 { transform: rotate(30deg) translate(-130px) rotate(-30deg); }
    .roman-numerals .num9 { transform: translate(-130px); }
    .roman-numerals .num11 { transform: rotate(60deg) translate(-130px) rotate(-60deg); }
    .roman-numerals .num12 { transform: translateY(-130px); }
  </style>
</head>
<body class="bg-dark">
  <div class="clock-container">
    <div class="roman-numerals">
      <span class="num12">XII</span>
      <span class="num1">I</span>
      <span class="num2">II</span>
      <span class="num3">III</span>
      <span class="num4">IV</span>
      <span class="num5">V</span>
      <span class="num6">VI</span>
      <span class="num7">VII</span>
      <span class="num8">VIII</span>
      <span class="num9">IX</span>
      <span class="num10">X</span>
      <span class="num11">XI</span>
    </div>
    <div class="hour-hand"></div>
    <div class="minute-hand"></div>
    <div class="second-hand"></div>
    <div class="clock-center"></div>
    
    <!-- Add tick marks for minutes -->
    <div class="tick" style="transform: rotate(6deg);"></div>
    <div class="tick" style="transform: rotate(12deg);"></div>
    <div class="tick" style="transform: rotate(18deg);"></div>
    <div class="tick" style="transform: rotate(24deg);"></div>
    <div class="tick" style="transform: rotate(36deg);"></div>
    <div class="tick" style="transform: rotate(42deg);"></div>
    <div class="tick" style="transform: rotate(48deg);"></div>
    <div class="tick" style="transform: rotate(54deg);"></div>
    <div class="tick" style="transform: rotate(66deg);"></div>
    <div class="tick" style="transform: rotate(72deg);"></div>
    <div class="tick" style="transform: rotate(78deg);"></div>
    <div class="tick" style="transform: rotate(84deg);"></div>
  </div>
  
  <footer class="mt-4">
    <p class="mb-0">
      Design By Syed | <b>codecraftbysyed@gmail.com</b>
    </p>
  </footer>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const hourHand = document.querySelector('.hour-hand');
    const minuteHand = document.querySelector('.minute-hand');
    const secondHand = document.querySelector('.second-hand');

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondDegree = (seconds / 60) * 360 + 90;
      const minuteDegree = (minutes / 60) * 360 + 90 + (seconds / 60) * 6;
      const hourDegree = (hours / 12) * 360 + 90 + (minutes / 60) * 30;

      secondHand.style.transform = `translateX(-50%) rotate(${secondDegree}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteDegree}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourDegree}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Initialize clock hands
  </script>
</body>
</html>
